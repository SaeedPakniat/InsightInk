<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e1a" />
    <title>InsightInk — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #0c0e1a;
        color: #f5f1e6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        background:
          radial-gradient(circle at 10% 0%, rgba(242, 169, 59, 0.08), transparent 28rem),
          radial-gradient(circle at 100% 100%, rgba(88, 166, 166, 0.08), transparent 32rem), #0c0e1a;
      }

      main {
        width: min(100%, 38rem);
        padding: clamp(1.5rem, 6vw, 2.5rem);
        border: 1px solid rgba(245, 241, 230, 0.16);
        border-radius: 1rem;
        background: #12162b;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
      }

      .mark {
        width: 3rem;
        height: 3rem;
        margin-block-end: 1.25rem;
        display: grid;
        place-items: center;
        border: 1px solid rgba(245, 241, 230, 0.18);
        border-radius: 0.75rem;
        color: #f2a93b;
        font-size: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 7vw, 2.8rem);
        line-height: 1.25;
      }

      p {
        margin: 0.75rem 0 0;
        color: #c8c4bb;
        line-height: 1.8;
      }

      .english {
        margin-block-start: 1.5rem;
        padding-block-start: 1.5rem;
        border-block-start: 1px solid rgba(245, 241, 230, 0.12);
        direction: ltr;
        text-align: left;
      }

      button {
        min-height: 2.75rem;
        margin-block-start: 1.75rem;
        padding-inline: 1rem;
        border: 1px solid #f2a93b;
        border-radius: 0.75rem;
        background: #f2a93b;
        color: #241704;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }

      button:focus-visible {
        outline: 3px solid #58a6a6;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body data-offline-page="true">
    <main>
      <div class="mark" aria-hidden="true">◉</div>
      <h1>فعلاً آفلاین هستید</h1>
      <p>برای دریافت محتوای تازه به اینترنت نیاز است. پس از برقراری اتصال، دوباره تلاش کنید.</p>

      <div class="english">
        <strong>You are offline.</strong>
        <p>InsightInk needs a connection for fresh content. Reconnect and try again.</p>
      </div>

      <button type="button" onclick="location.reload()">تلاش دوباره / Retry</button>
    </main>
  </body>
</html>
